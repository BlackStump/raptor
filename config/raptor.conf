# file_frames = 0             # 0 = one file per day; N = rotate every N frames (min 60)
# max_mb = 2048               # quota for <storage_path>/timelapse; 0 = unlimited
                              # files are all-keyframe MP4s from the recording
                              # stream, SEI-timecoded and signature-chained like
                              # every recording; playback compresses real time by
                              # interval x playback_fps (10s x 30 = 300x)

