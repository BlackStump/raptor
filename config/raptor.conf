# Raptor Streaming System configuration
# See raptor-docs/23-rss-config.md for full option reference

[system]
# The camera streams to anyone who can reach it until [rtsp] and [http] are
# each given a username and a password. That is the useful default on a bench
# and a poor one in production, so while it holds, rsd and rhd each say so at
# startup and rod burns UNSECURED - NO PASSWORD SET into the video. Setting the
# credentials clears all three; nothing ever refuses to stream.
#
# Set unsafe = true when an open stream is the intent -- a feed into an NVR on
# an isolated VLAN, say. It silences the warnings and removes the banner, and
# it exists so that the file records the decision rather than the state simply
# being the one nobody got round to changing.
# unsafe = false
#
# Video producer used by RVD. The V4L2 backend is currently a zero-copy T41
# main-stream path: NV12 capture -> DMA-BUF -> OpenIMP H.264.
video_backend = imp          # imp / v4l2
video_device = /dev/video0

[sensor]
# All values auto-detected from /proc/jz/sensor if omitted (Ingenic); on
# HiSilicon the name comes from the loaded sys_config module's sensors=
# parameter, and nothing else is needed
#
# HiSilicon V5 (Hi3516CV610/CV608): name it here. The name picks the sensor
# library and the tuning file, and it has to agree with what open_sys_config
# was loaded with -- that module decides the sensor's MCLK from the same name
# (os04d10 24 MHz, sc4336p 27 MHz), so a disagreement runs the sensor off-rate
# with no error, only MIPI lane overflows in /proc/umap/mipi_rx. Left out, the
# backend reads the module's own parameter, then falls back to guessing from
# OpenIPC's hostname convention and says loudly that it did.
# name = gc4653
# i2c_addr = 0x29
# i2c_adapter = 0
# fps = 0
# GPIO pins (default -1 = disabled):
# rst_gpio = -1               # sensor reset GPIO
# pwdn_gpio = -1              # sensor power down GPIO
# power_gpio = -1             # sensor power GPIO
# T40/T41 only:
# boot = 0                    # sensor boot mode (0=linear, 1=WDR, 2=60fps crop)
# mclk = 1                    # clock source (0=MCLK0, 1=MCLK1, 2=MCLK2)
# video_interface = 0         # video interface type (MIPI/DVP)
# SigmaStar infinity6c only:
# mode = -1                   # sensor driver mode by index; -1 = the first that
#                             # covers stream0's size and rate. The driver's list
#                             # is in the rvd log at debug level ("sensor mode N").
# antiflicker = 2             # 0=off, 1=50Hz, 2=60Hz (match your power grid frequency)
# low_latency = false         # encoder immediate output for all streams (saves ~100ms)

# -- Multi-sensor (dual/triple camera) --
# To enable, replace [sensor] above with [sensor0] and add [sensor1].
# Requires: dual-sensor ISP firmware, fsync-capable sensor drivers (s0/s1 variants),
# and ISP module loaded with direct_mode=X + mipi_switch_gpio set.
# See raptor-docs/multi-sensor.md for full setup guide.
#
# [sensor0]
# name = sc2336p
# i2c_addr = 0x30
# i2c_adapter = 0
# sensor_id = 0
# width = 1920                # required: procfs doesn't report with s0/s1 drivers
# height = 1080
#
# [sensor1]
# name = sc2336ps1
# i2c_addr = 0x32
# i2c_adapter = 0
# sensor_id = 1
#
# [mipi_switch]
# enabled = false             # T23 only: set true if custom GPIO needed
# switch_gpio = 7             # GPIO controlling MIPI switch chip
# main_gstate = 0             # GPIO state to select main sensor
# sec_gstate = 1              # GPIO state to select secondary sensor
# switch_gpio2 = 0            # second MIPI switch GPIO (if needed)

[stream0]
# width = 1920                # defaults to sensor resolution if omitted
# height = 1080
# fps = 25
# codec = h264
# profile = 2
# bitrate = 3000000
# max_bitrate = 0             # 0 = auto (4/3 of target for capped modes)
# rc_mode = cbr               # cbr/vbr/capped_vbr/capped_quality/fixqp/smart
# gop = 30
# init_qp = -1                # initial QP (-1 = SDK default; required for fixqp, range 0-51)
# min_qp = -1                 # -1 = built-in default (15 cbr, 20 vbr/capped)
# max_qp = -1                 # -1 = built-in default (51 cbr, 45 vbr/capped)
# ip_delta = -1               # QP delta I vs P frames (-1 = SDK default, T31+)
# pb_delta = -1               # QP delta P vs B frames (-1 = SDK default, T31+)
# max_psnr = 0                # PSNR quality cap for capped modes (0 = SDK default, T31+)
# nr_vbs = 2
# ivdc = true                 # ISP-VPU Direct Connect (T23+ only, reduces rmem)
# osd_enabled = true          # per-stream OSD (default true)
# jpeg = true                 # per-stream JPEG snapshot (default true)
# jpeg_quality = 75           # override [jpeg] quality
# jpeg_fps = 1                # override [jpeg] fps

[stream1]
# enabled = true
# width = 640                 # defaults to 640 wide at the sensor's aspect
# height = 360                #   (2592x1944 -> 640x480, 1920x1080 -> 640x360)
# fps = 25
# codec = h264
# profile = 2
# bitrate = 1000000
# max_bitrate = 0             # 0 = auto (4/3 of target for capped modes)
# rc_mode = cbr               # cbr/vbr/capped_vbr/capped_quality/fixqp/smart
# gop = 30
# init_qp = -1                # initial QP (-1 = SDK default; required for fixqp, range 0-51)
# min_qp = -1                 # -1 = built-in default (15 cbr, 20 vbr/capped)
# max_qp = -1                 # -1 = built-in default (51 cbr, 45 vbr/capped)
# ip_delta = -1               # QP delta I vs P frames (-1 = SDK default, T31+)
# pb_delta = -1               # QP delta P vs B frames (-1 = SDK default, T31+)
# max_psnr = 0                # PSNR quality cap for capped modes (0 = SDK default, T31+)
# nr_vbs = 2
# osd_enabled = true          # per-stream OSD (default true)
# jpeg = true                 # per-stream JPEG snapshot (default true)
# jpeg_quality = 75           # override [jpeg] quality
# jpeg_fps = 1                # override [jpeg] fps

# -- Sensor 1 streams (multi-sensor only) --
# [sensor1_stream0]
# width = 1920
# height = 1080
# fps = 25
# codec = h264
# profile = 2
# bitrate = 2500000
# rc_mode = vbr
# gop = 50
# min_qp = 20
# max_qp = 42
# nr_vbs = 2
# ivdc = true                 # IVDC for dual-sensor (requires ISP direct_mode=2)
# osd_enabled = true          # per-stream OSD (default true)
#
# [sensor1_stream1]
# enabled = true
# width = 640
# height = 360
# fps = 25
# codec = h264
# profile = 2
# bitrate = 1000000
# rc_mode = vbr
# gop = 50
# min_qp = 22
# max_qp = 38
# nr_vbs = 2
# osd_enabled = true          # per-stream OSD (default true)

[image]
# Each knob here has three settings, and they are three different instructions.
#
#   absent   the sensor's tuning binary decides and is not written to at all.
#            This is the default and usually the right answer: the tuner chose
#            these values for this sensor and this lens.
#   auto     put the module into its auto mode, where the ISP interpolates the
#            tuning's per-gain curve. Worth saying out loud only to override a
#            tuning that pinned the module to a fixed value.
#   a number pin the module at that value for the whole gain range, which
#            discards the curve. The units are the hardware's own -- see below.
#
# Leaving a knob commented out is therefore NOT the same as setting it to a
# middle value. Infinity6C's imx335 tuning ships contrast pinned at 65 on
# purpose, and writing `auto` over that costs about six grey levels of
# contrast.
#
# THE RANGES BELOW ARE PER-SOC, and the numbers in the comments are what the
# camera in front of you accepts only if it says so. Ask it:
#
#     raptorctl rvd get-isp        # `caps` gives min, max and neutral per knob
#
# `caps` also reports whether each module is switched on. A tuning is entitled
# to ship one off -- Infinity6C's imx335 ships brightness that way -- and on
# SigmaStar, naming a value switches it back on so the value has an effect.
# Setting the knob to `auto` hands the switch back to the tuning, so that is
# undoable without a reflash. Defog is the exception, since its switch is a knob
# of its own: `defog` turns the module on and off, `defog_strength` only sets
# the level.
#
# brightness = auto            # Ingenic 0-255 (neutral 128); Infinity6C and HiSilicon 0-100 (50)
# contrast = auto              # Ingenic 0-255 (neutral 128); Infinity6C and HiSilicon 0-100 (50)
# saturation = auto            # Ingenic 0-255 (neutral 128); Infinity6C 0-127 (32)
# sharpness = auto             # Ingenic 0-255 (neutral 128); Infinity6C 0-127
# hue = auto                   # Ingenic only, 0-255 (neutral 128)
# sinter = auto                # spatial noise reduction (T20-T31 only, 0-255)
# temper = 1                   # temporal noise reduction. Ingenic 0-255;
#                              # SigmaStar 0-7, and 1 is what the pipeline comes
#                              # up on. No auto mode -- it is a channel level,
#                              # not a tuning module.
# ae_comp = 0                  # AE compensation. SigmaStar is EV steps, -20..20,
#                              # 0 meaning no compensation; Ingenic 0-255; HiSilicon
#                              # 0-255 where neutral is the tuning's own (56 by default).
# max_again = 160              # max analog gain (0-160, higher = more noise in low light)
# max_dgain = 80               # max digital gain (0-160)
# dpc_strength = auto          # dead pixel correction (T23/T31 only, 0-255)
# drc_strength = auto          # dynamic range compression (T21/T23/T31 and
#                              # SigmaStar, 0-255; HiSilicon 0-1023). `auto` leaves the tuning's own
#                              # curve alone; a number pins one strength across the
#                              # gain range. Same scale as majestic's overrideWdr,
#                              # so a value carried over from a majestic config
#                              # means the same picture.
# defog_strength = auto        # defog / dehaze (T23/T31 only, 0-255)
# highlight_depress = 0        # highlight depression (0-255, T20-T31 only)
# backlight_comp = 0           # backlight compensation (0-10, T23/T31 only)
# hflip = 0                    # horizontal flip (0 or 1)
# vflip = 0                    # vertical flip (0 or 1)
# rotate = 0                   # 0, 90, 180 or 270 (SigmaStar and HiSilicon). A stream's
#                              # width/height stay the picture as the sensor sees it; at
#                              # 90 and 270 it is encoded as height x width.

# -- Sensor 1 image (multi-sensor only) --
# [sensor1_image]
# brightness = 128
# contrast = 128
# saturation = 128
# sharpness = 128
# hue = 128
# sinter = 128
# temper = 128
# ae_comp = 128
# max_again = 160
# max_dgain = 80
# hflip = 0
# vflip = 0

[jpeg]
# enabled = true
# quality = 75
# fps = 1
# bufshare = false              # incompatible with rmem refmode (T31/T40/T41)
# idle = true                   # stop JPEG encoder when no viewers (saves CPU/VPU)
# Per-stream: set jpeg = false, jpeg_quality, jpeg_fps in [streamN] sections

[ring]
# refmode = false              # zero-copy: encoder writes to shared memory, ring is metadata-only
# Slot counts must be a power of two, 2..64. A value that is not one is
# rounded down, with a warning naming the key.
# main_slots = 32
# main_data_mb = 0            # 0 = auto-size from bitrate (recommended)
# sub_slots = 32
# sub_data_mb = 0             # 0 = auto-size from bitrate

[audio]
# enabled = true
# input = amic                # amic (analog mic) or dmic (digital mic array)
# sample_rate = 16000
# codec = l16                 # pcmu, pcma, l16, aac, opus
# opus_complexity = 0         # 0-10 (lower = less CPU, default 5)
# bitrate = 128000            # for aac/opus (bits per second)
# aac_profile = lc            # lc (default), he (HE-AAC v1, needs sample_rate >= 32000),
#                             # or auto (faac picks by rate/bitrate)
# volume = 80
# gain = 25
# device = 1                  # audio input device number
# DMIC options (input = dmic only, T30/T31/T32/T33/T40/T41):
# dmic_count = 1              # number of digital mics (1/2/4)
# dmic_aec_id = 0             # which mic for AEC processing (0-3)
# Audio output (speaker / backchannel)
# ao_enabled = false
# ao_volume = 80
# ao_gain = 25
# Audio effects (requires libaudioProcess.so)
# aec_enabled = false         # acoustic echo cancellation (requires ao_enabled)
# aec_profile_path = /etc     # directory containing webrtc_profile.ini
# ns_enabled = true           # noise suppression
# ns_level = 1               # 0=low, 1=moderate, 2=high, 3=veryhigh
# hpf_enabled = true          # high-pass filter (removes DC offset / low rumble)
# agc_enabled = true          # automatic gain control
# agc_target_dbfs = 10        # target level (0-31 dBfs)
# agc_compression_db = 0      # compression gain (0-90 dB)

[rtsp]
# enabled = true
# port = 554
# max_clients = 4
# Custom endpoint aliases. Setting an alias replaces the default /streamN
# path for that stream (security through obscurity) - only the alias is
# accepted. Streams left blank keep their /streamN default. Aliases must
# match [A-Za-z0-9_.-]+ and cannot shadow default/reserved names; invalid
# entries are logged and silently ignored at startup.
# endpoint_main = ch0                # sensor 0 main  (replaces: /stream0)
# endpoint_sub = ch1                 # sensor 0 sub   (replaces: /stream1)
# endpoint_s1_main = ch2             # sensor 1 main  (replaces: /stream2)
# endpoint_s1_sub = ch3              # sensor 1 sub   (replaces: /stream3)
# endpoint_s2_main = ch4             # sensor 2 main  (replaces: /stream4)
# endpoint_s2_sub = ch5              # sensor 2 sub   (replaces: /stream5)
# jpeg = false                       # expose JPEG rings as MJPEG RTSP streams
# endpoint_jpeg = mjpeg              # JPEG main      (default: /jpeg)
# endpoint_jpeg_sub = mjpeg_sub      # JPEG sub       (default: /jpeg_sub)
# Digest credentials, enabled only when both are set. Keep them the same as
# [http] below: they are two keys for one camera account, and rmq's Camera
# username / Camera password controls write both pairs from one field.
# Until both are set the stream is open to anyone who can reach the camera;
# see [system] unsafe for the warning and the on-video banner that say so.
# username = admin
# password = secret
# tls = false                 # enable RTSPS (default port changes to 322)
# tls_cert = /etc/ssl/certs/uhttpd.crt
# tls_key = /etc/ssl/private/uhttpd.key
# tls_cipher_preference = default   # default | chacha20
#   default  - mbedtls built-in cipher order (GCM-first in TLS 1.3).
#              Best on servers with HW AES+GHASH (x86 AES-NI, ARMv8-crypto).
#   chacha20 - force TLS 1.3 to ChaCha20-Poly1305 only; TLS 1.2 falls back
#              to the CBC/CCM/GCM order. Best on slow MIPS SoCs where every
#              AES-GCM TLS record costs an ioctl to the /dev/aes engine;
#              scalar userspace ChaCha20 beats HW AES on Ingenic T-series.
# session_name = Raptor Live  # SDP session name (s=)
# session_info =              # SDP session description (i=)
# session_timeout = 60        # RTSP session timeout in seconds (min 10)
# tcp_sndbuf = 65536          # requested TCP send-buffer bytes; Linux doubles/caps it
#                             # (lower bounds stale data; blocking writes split large IDRs)
# backchannel = false         # two-way audio (ONVIF Profile T). Offers PCMU,
#                             # PCMA, opus, AAC and L16; the client picks by
#                             # sending. TCP interleaved or UDP transport.
# backchannel_codecs =        # restrict the offer, e.g. pcmu,opus (empty =
#                             # everything the build carries). PCMU is the
#                             # ONVIF baseline; excluding it is honored but
#                             # warned. Applies to new sessions immediately
#                             # (raptorctl rsd set-backchannel-codecs ...)
# rtcp_sr = true              # RTCP Sender Reports every 5s (NVRs use them for A/V sync)
# idr_on_join = true          # force a keyframe when a viewer joins (fast join; small
#                             # burst to other viewers. false = join waits up to one GOP)
sei_timecode = false          # per-frame MISB ST 0604 UTC timecode SEI (~36 B/frame,
                              # survives NVR-side copy recording; RSD only; code default: true)

[http]
# enabled = true
# port = 8080
# max_clients = 4
# Basic auth, enabled only when both are set. The same account as [rtsp] above.
# username = admin
# password = secret
# https = false               # HTTPS for snapshots/MJPEG (requires cert + key)
# cert = /etc/ssl/certs/uhttpd.crt
# key = /etc/ssl/private/uhttpd.key
exif_timestamp = false        # EXIF capture time (UTC, µs) in snapshots + MJPEG frames
sign_snapshots = false        # Ed25519-sign /snap.jpg (verify: rverify; key: [recording] sign_key)

[osd]
# enabled = true
# Use ISP OSD instead of IPU OSD (T23/T32/T40/T41 only).
# ISP OSD works with IVDC and has zero DDR bandwidth overhead.
# IPU OSD is the default and works on all platforms.
# isp_osd = false
# font = /usr/share/fonts/default.ttf
# font_size = 24                # pixels on the main stream, and a sub stream
#                               # scales it down by its share of the height.
#                               # A percentage -- font_size = 4% -- is that
#                               # share of each stream's own height instead,
#                               # so the text stays the same size on the
#                               # picture whatever the sensor turns out to be
#                               # encoding. One decimal place, 0.5% to 10%.
# font_color = 0xFFFFFFFF       # global default text color (BGRA)
# font_stroke = 1               # global default stroke width (0-5)
# stroke_color = 0xFF000000     # global default stroke color (BGRA)
# time_format = %Y-%m-%d %H:%M:%S
# privacy_color = 0xFF000000

# -- OSD elements --
# Each [osd.<name>] section defines an OSD element.
# Elements can also be added/removed at runtime via raptorctl.
#
# Common keys:
#   type       = text | image | overlay
#   position   = top_left | top_center | top_right | bottom_left |
#                bottom_center | bottom_right | center | x,y
#   visible    = true | false
#   sub_only   = true | false          (render on sub-stream only)
#
# Text element keys:
#   template   = string with %var% expansion. Built-in variables:
#                  %time% %uptime% %hostname% %ip% %ip6%
#                  %ae_luma%     AE scene luma, polled from rvd once a second
#                  %total_gain%  sensor x ISP gain, in the platform's own raw
#                                units (SigmaStar: x1024, so 1024 = 1.0x) --
#                                the same scale [ircut] night_gain uses
#                  %soc_temp%    chip temperature in C, where the kernel
#                                exposes one (SigmaStar msys TEMP_R, or a
#                                standard thermal zone)
#                The last three render "--" when there is no reading, which
#                for the exposure pair includes the first second after boot:
#                rvd zeroes them until the ISP is tuned. Custom variables set
#                via `raptorctl rod set-var` expand too.
#   align      = left | center | right
#   max_chars  = 20                    (SHM width sizing, max 128)
#   update     = tick | change         (tick = every second, change = on template change)
#   font_size  = 0                     (0 = use global; px or % as above)
#   color      = 0xFFFFFFFF            (0 = use global, BGRA)
#   stroke_color = 0xFF000000          (0 = use global, BGRA)
#   stroke_size = -1                   (-1 = use global)
#
# Image element keys:
#   path       = /path/to/file.bgra
#   width      = pixels
#   height     = pixels

# A section named for one of the six places -- top_left, top_center,
# top_right, bottom_left, bottom_center, bottom_right, or center -- sits
# there and aligns out from that edge without a `position` or `align` line.
# Either line still wins where it is given, and a section named anything
# else places itself the old way.
#
# The elements below are named for what they show rather than for where
# they sit, because where they sit is a setting: the web console offers the
# first four [osd.*] sections of this file as four elements and lets each
# one be placed, so a section named for a corner it has been moved out of
# would be a name that lies.

[osd.timestamp]
type = text
# visible = true
template = %time%
position = top_left
align = left
max_chars = 22

[osd.uptime]
type = text
# visible = true
template = %uptime%
position = top_right
align = right
max_chars = 18

[ircut]
# enabled = true
# mode = auto                 # auto, day, or night
# trigger = luma              # luma (default), gain (legacy), adc
                              # (photoresistor), or photo
                              # luma/gain/photo need the platform's HAL to report
                              # exposure. Where it reports none, ric says so once
                              # and holds its mode rather than reading a missing
                              # reading as darkness; adc needs no ISP.
# night_luma = 20             # ae_luma below this -> night (0-255)
                              # Gen3 SoCs (T32/T33/T40/T41) derive luma from the
                              # linear AE histogram and read lower than Gen1/2's
                              # GetAeLuma for the same scene (bright ~50 vs ~100+);
                              # tune per model, not across generations.
# night_gain = 80000          # total_gain above this -> night (regardless of luma)
# day_gain_pct = 25           # night->day: gain below this % of night baseline
# probe_gain_pct = 90         # night: gain dip below this % of the night
                              # baseline lifts the IR LEDs for an ambient
                              # luma probe (day detection for sensors whose
                              # gain floors under IR, e.g. T20; 0 = off)
# probe_holdoff_sec = 60      # minimum seconds between failed probes
# probe_recheck_sec = 0       # optionally probe after this long in night with
                              # no dip: strong close-range IR can hide room
                              # light from every AE metric; this cuts IR and
                              # visibly disturbs live video, so default is off
# adc_channel = 0             # ADC channel for photoresistor (trigger=adc)
# adc_night = 200             # ADC below this -> night (trigger=adc)
# adc_day = 600               # ADC above this -> day (trigger=adc)
                              # the ADC nodes ric opens are Ingenic
                              # (/dev/{ingenic,jz}_adc_aux_N); elsewhere this
                              # falls back to luma at startup
# photo_ev_night = 50000      # EV above this -> dark (trigger=photo, high ev=dark)
# photo_ev_deep = 150000      # EV above this -> very dark (trigger=photo)
# photo_ev_day = 5000         # EV below this -> bright (trigger=photo)
# photo_rgain_rec = 0         # R-gain AWB baseline (0=auto-calibrate from sensor)
# photo_bgain_rec = 0         # B-gain AWB baseline (0=auto-calibrate from sensor)
# night_threshold = 40000     # total_gain above this -> night (trigger=gain only)
# day_threshold = 25000       # total_gain below this -> day (trigger=gain only)
# hysteresis_sec = 5          # consecutive seconds before switching
# poll_interval_ms = 1000
# night_fps = 0               # night sensor rate (0 = off): frame period
                              # bounds integration time, so a lower rate
                              # lets AE trade gain (noise) for photons;
                              # day restores the boot rate. With
                              # trigger=gain, calibrate day_threshold
                              # with this enabled
# gpio_ircut = -1             # -1 = auto from /etc/thingino.json if present
                              # (an optional source, absent on non-thingino
                              # images -- set the pins here on those)
# gpio_ircut2 = -1            # second pin for a motor-driven (H-bridge) filter;
                              # -1 = single-pin filter, held not pulsed
# gpio_ircut_active_low = false
                              # single-pin filter wired the other way
                              # round. false drives the pin high for day
                              # (filter in the light path), low for night.
                              # No ircut2 equivalent: across an H-bridge the
                              # polarity is the ORDER of the two pins, so
                              # swap those -- this key is ignored there
# gpio_irled = -1             # ir850 pin, -1 = auto from /etc/thingino.json
# gpio_irled2 = -1            # ir940 pin, -1 = auto from /etc/thingino.json
# gpio_irled_active_low = false
# gpio_irled2_active_low = false
# pwm_irled = -1              # ir850 bank on a PWM channel instead of a GPIO
                              # (Fullhan: the Vatilon PB4's lamps are PWM-only).
                              # Used when gpio_irled is -1. Each change writes
                              # "<chn>,<mask>,<duty>,<period>,0,0,0,0" to
                              # pwm_irled_path; off is duty 0.
# pwm_irled_mask = 12
# pwm_irled_duty = 8500       # ns on, out of
# pwm_irled_period = 10000    # ns
# pwm_irled_path = /proc/driver/pwm
                              # the 850 and 940 banks light on 0 rather
                              # than 1. A bank wired the wrong way round
                              # is quieter than a filter is -- the picture
                              # looks right and the illuminator simply runs
                              # all day and stays dark all night
# ir850 = true                # enable 850nm IR LED (visible glow, stronger)
# ir940 = false               # enable 940nm IR LED (invisible, weaker);
                              # auto-enabled when 940 is the board's ONLY
                              # bank and this key is not set
# pulse_ms = 100              # dual-GPIO ircut coil pulse width, ms (1-1000)
                              # a margin, not a target: units of the same model
                              # differ by more than 3x in what their coil needs,
                              # and a pulse that is too short leaves the filter
                              # where it was until the next transition

[recording]
# enabled = false
# mode = continuous           # continuous, motion, or both
# stream = 0
# audio = true
# segment_minutes = 5
# segment_seconds = 0          # nonzero overrides segment_minutes (debug/testing)
# storage_path = /mnt/mmcblk0p1/raptor  # auto-created when on mounted media
#                             # (SD/NFS/SMB); never auto-created on the root fs
# max_storage_mb = 0
# prebuffer_sec = 5           # seconds of pre-event footage in motion clips (0-5)
# clip_length_sec = 60        # motion clip max duration before rotation
# clip_max_mb = 100           # max total clip storage
sei_timecode = false          # embed MISB ST 0604 UTC timecode SEI in every frame
                              # (code default: true)
sign = false                  # Ed25519 hash-chain provenance signing (verify: rverify;
                              # code default: true)
# sign_key = /etc/raptor/sign_ed25519.key  # key seed; generated on first use,
#                             # public key exported to <sign_key>.pub

[timelapse]
# enabled = false
