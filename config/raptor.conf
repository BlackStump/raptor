[push]
# Stream push to an external receiver.
# RTMP/RTMPS pushes to streaming services (YouTube, Twitch, etc.);
# udp:// sends RTP directly to a host:port with no session or
# handshake -- for relays and custom receivers on the local network.
# UDP push is video only and never queues: a send the socket refuses
# is dropped, so the receiver always gets the freshest frame.
# enabled = false
# url = rtmps://a.rtmps.youtube.com/live2/your-stream-key
# url = rtmp://live.twitch.tv/app/live_your-key
# url = udp://192.168.1.50:5600
# url = udp://[fd00::50]:5600
# stream = 0                   # 0=main, 1=sub
# audio = true                 # include audio (RTMP only; transcoded to AAC if needed)
# autostart = true             # start pushing on daemon launch
# reconnect_ms = 5000          # reconnect delay on failure (1000-60000)
# tcp_sndbuf = 262144           # TCP send buffer bytes (default 256KB, absorbs WiFi stalls)

[srt]
# SRT listener daemon — serves MPEG-TS over SRT protocol
# enabled = false                # SRT listener (opt-in)
# port = 9000                   # SRT listener port
# latency = 120                 # SRT latency in ms (TsbPd buffer)
# passphrase =                  # AES encryption passphrase (10-79 chars, empty = none)
# pbkeylen = 16                 # AES key length: 16, 24, or 32
# max_clients = 4               # max simultaneous SRT clients
# stream = 0                    # default video stream (0=main, 1=sub)
# audio = true                  # include audio in TS stream

[filesource]
# File source daemon (replaces RVD+RAD on platforms without ISP hardware)
# enabled = false
# video_file = /mnt/mmcblk0p1/test.h264
# audio_file = /mnt/mmcblk0p1/test.pcm
# codec = auto                  # auto, h264, h265
# fps = 25
# loop = true
# audio_codec = l16             # l16, pcmu (g711u), pcma (g711a)
# audio_sample_rate = 16000
# video_ring_name = main
# video_slots = 32
# video_data_mb = 2
# audio_ring_name = audio
# audio_slots = 32
# audio_data_mb = 1

[mqtt]
# MQTT bridge (rmq). One broker connection for the whole camera: a retained
# status topic backed by a Last Will, a state document polled from the running
# daemons, Home Assistant discovery, and a command topic.
#
# The bridge decides nothing about what may be set. Every command it receives
# is handed to rcd, whose table is the allowlist: a key it does not name cannot
# be written, a field an entry does not name is dropped, and the request that
# reaches a daemon is rebuilt from the table rather than relayed. That table
# holds no strings except the four credential keys — so no path, format or
# endpoint in this file is reachable from the broker.
#
# Two tiers, and rcd says which one a key is on. A live setting takes effect at
# once. Anything a daemon reads only at bring-up is saved, and the daemon is
# left running behind it until an apply — see auto_apply below.
# enabled = false
# host = 127.0.0.1
# port = 1883
# username =                    # both blank for an anonymous broker
# password =
# tls = false                   # a broker certificate must verify; there is no
#                               # plaintext fallback. Needs libmosquitto built
#                               # with a TLS backend and a synced clock.
# client_id =                   # default: raptor-<primary MAC>. Must be unique
#                               # per camera — a broker evicts the older session
#                               # when two clients share an id.
# topic_prefix =                # default: raptor/<client_id>
# keepalive = 60
# reconnect_delay_ms = 5000
# poll_interval = 10            # seconds between state publishes
# commands = true               # false makes the bridge read-only: no command
#                               # subscription, and no controls advertised
# auto_apply = false            # a setting that only takes effect at bring-up
#                               # is saved and the owning daemon is left
#                               # running behind it; "Changes pending restart"
#                               # turns on and the Apply button enacts it.
#                               # true restarts the owner as soon as the
#                               # setting is saved, which is what earlier
#                               # builds did unconditionally -- convenient,
#                               # but it means moving a resolution dropdown
#                               # stops capture for tens of seconds with no
#                               # warning. Settings that apply live are
#                               # unaffected either way: those take effect at
#                               # once and always have
# snapshot = true              # advertise the picture to Home Assistant as an
#                               # image entity. What is published to
#                               # <topic_prefix>/snapshot is the URL, not the
#                               # JPEG: Home Assistant fetches /snap.jpg from
#                               # rhd, so the broker carries a couple of hundred
#                               # bytes rather than the frame. Costs nothing
#                               # while idle — rvd encodes JPEG only while its
#                               # ring has a reader, and rhd holds one only for
#                               # the length of a fetch.
#                               # Nothing needs saying here about whether the
#                               # camera can serve one: the entity appears only
#                               # while rhd is listening and rvd reports a JPEG
#                               # channel, so [jpeg] enabled = false withdraws
#                               # it rather than leaving a tile that 404s.
#                               # Set false to withhold it anyway. The one
#                               # reason to: the still's URL carries the [http]
#                               # credential, since Home Assistant's image
#                               # entity has nowhere else to put one — so a
#                               # camera with [http] auth on puts that password
#                               # in a retained message on the broker. With
#                               # commands = true the broker could set it
#                               # anyway; with commands = false this is the one
#                               # thing it learns that it otherwise would not
# snapshot_stream = 1           # which stream's JPEG channel to take it from.
#                               # 1 (sub) by default because the difference is
#                               # not marginal — on a 2560x1920 sensor the main
#                               # still measures ~600 KB against the sub's ~6 KB,
#                               # and both are shown at tile size
# snapshot_interval = 0         # seconds between automatic refreshes; 0 publishes
#                               # once per broker connection and then only when
#                               # asked, via {"cmd":"snapshot"}. A message on the
#                               # topic is what makes Home Assistant fetch again,
#                               # so this is the refresh rate — and each refresh
#                               # is one JPEG encode, which is what keeps it off
#                               # by default. The URL is retained, so a dashboard
#                               # opened later has something to fetch
# DEPRECATED -- the Home Assistant integration below is no longer maintained.
# It stays in the tree and keeps working, but it is not where effort goes and it
# is not exercised against new Home Assistant releases. The web console (rhd) is
# the supported way to drive a camera, and it is the one that reaches every
# setting: the discovery table here is a curated subset, its controls are
# number-and-switch entities that cannot express an [image] knob's third state
# (`auto`), and it has no way back to a knob the config never named. Expect it
# to be removed once nothing depends on it.
#
# ha_discovery = true          # entities are created from the definitions the
#                               # camera publishes, but Home Assistant applies an
#                               # entity's name and whether it is enabled only
#                               # when it first creates it. `raptorctl rmq
#                               # rediscover` removes the device and lets the
#                               # next poll rebuild it, which is how a firmware
#                               # upgrade's entity changes reach a camera Home
#                               # Assistant already knows. It also discards any
#                               # renaming, area or dashboard placement done
#                               # there, so it is a command and not automatic
# discovery_prefix = homeassistant
# device_name =                 # what the camera is called in Home Assistant;
#                               # default: this host's name, which on these
#                               # images already reads vendor-soc-unit
# device_subtitle =             # the line under that name. Default: the
#                               # camera's own address on the interface the
#                               # broker is on, so a page of identical cameras
#                               # says which one this is — and says where its
#                               # web console is

# -- CPU Affinity and Scheduling (T40/T41/A1 dual-core) --
# Each daemon reads cpu_affinity and sched_priority from its own section.
# cpu_affinity: pin to CPU core (0 or 1). Ignored on single-core SoCs.
# sched_priority: SCHED_FIFO real-time priority (1-99). Omit for SCHED_OTHER.

[rcd]
# Config daemon (rcd). Owns raptor.conf: it validates every edit against its
# table, writes the file, applies what can be applied to a running daemon, and
# sequences the restarts for what cannot. rmq and raptorctl are its clients and
# neither writes the file itself.
#
# On by default. Turning it off leaves the daemons running exactly as
# configured, but nothing can change the configuration except editing this file
# by hand and restarting.
# enabled = true

[rvd]
# cpu_affinity = 0
# sched_priority = 50

[rsd]
# cpu_affinity = 1
# sched_priority = 30

[rad]
# cpu_affinity = 1
# sched_priority = 40

